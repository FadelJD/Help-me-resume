name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Pinned: TeX Live 2023 and poppler match tests/fixtures/templates/results.json.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install TeX and poppler (compile and check tests are real, not mocked)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-extra texlive-fonts-recommended lmodern \
            latexmk poppler-utils

      - name: Install package
        run: pip install -e ".[dev,check]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type-check
        run: mypy cvforge

      - name: Test
        run: pytest -q

  test-windows:
    # continue-on-error: Windows support is new and no maintainer has run it on a real Windows
    # machine yet. A failure here shows on the Actions page but does not block the Linux jobs.
    # TeX Live comes from the setup action without latexmk (cvforge runs the engine itself), and
    # poppler is deliberately not installed, so the Windows reader gate set
    # (pdfplumber, pypdf-layout, pdfium) is what gates and poppler-marked tests skip.
    # The corpus is Linux-only: its fonts are provisioned by a bash script.
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install TeX Live
        uses: TeX-Live/setup-texlive-action@v4
        with:
          cache: true
          packages: |
            scheme-basic
            geometry
            lm
            enumitem

      - name: Poppler must be absent, so the Windows gate set is what runs
        run: |
          $found = @(Get-Command pdftotext, pdfinfo -All -ErrorAction SilentlyContinue)
          foreach ($c in $found) {
            Write-Host "$($c.Name) at $($c.Source)"
            & $c.Source -v 2>&1 | Select-Object -First 1 | ForEach-Object { Write-Host "  $_" }
          }
          if ($found) { throw "poppler tools are on PATH (listed above)" }

      - name: Install package
        run: pip install -e ".[dev,check]"

      - name: cvforge doctor
        run: cvforge doctor

      # One command per step: a pwsh step's exit code is only its last native command's.
      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Type-check
        run: mypy cvforge

      - name: Test
        run: pytest -q -rs -m "not corpus"

  corpus:
    # Public template corpus: every template x every parser must match docs/parser-table.md.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install TeX, poppler and the corpus fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-extra texlive-fonts-recommended lmodern \
            latexmk poppler-utils
          bash tests/fixtures/templates/provision.sh

      - name: Install package
        run: pip install -e ".[dev,check]"

      - name: Corpus
        run: pytest -q -m corpus -rs

  example-cv:
    # The reusable CV workflow, run on the fictional example profile with this checkout.
    uses: ./.github/workflows/cv-check.yml
    with:
      template: templates/minimal.tex
      profile: examples/profile.cv.txt
      hat: examples/hats/developer.toml
      job: examples/job.txt
      cvforge-spec: ".[check]"
