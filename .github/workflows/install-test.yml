# Fresh-install test: a clean runner runs the README's install block for its OS, then the Quick
# start commands, in order, and nothing else. .github/scripts/readme_commands.py extracts them and
# lists the substitutions: the `pipx install ... git+...` line installs this commit instead, and on
# Windows the `winget install` lines are skipped (no winget on hosted runners; Python and TeX Live
# come from setup actions). Must end with a PDF and a passing check within 10 minutes of commands.
name: install-test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readme-quickstart:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo

      - name: Extract the install and Quick start commands from README.md
        env:
          REPO: ${{ github.workspace }}/repo
        run: |
          python3 "$REPO/.github/scripts/readme_commands.py" "$REPO/README.md" linux \
            > "$RUNNER_TEMP/quickstart.sh"
          cat "$RUNNER_TEMP/quickstart.sh"

      - name: Run them, timed
        working-directory: ${{ runner.temp }}
        env:
          REPO: ${{ github.workspace }}/repo
        run: |
          start=$(date +%s)
          bash "$RUNNER_TEMP/quickstart.sh"
          test -s my-cv/out/cv.pdf
          test -s my-cv/out/cv.report.json
          elapsed=$(( $(date +%s) - start ))
          echo "Quick start wall-clock: ${elapsed}s" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$elapsed" -lt 600

  readme-quickstart-windows:
    # continue-on-error: Windows support is new and no maintainer has run it on a real Windows
    # machine yet. A failure here shows on the Actions page but does not block the Linux jobs.
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo

      # Stand-ins for the README's two `winget install` lines.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: TeX Live (stands in for winget install MiKTeX; no latexmk, so cvforge runs pdflatex)
        uses: TeX-Live/setup-texlive-action@v4
        with:
          cache: true
          packages: |
            scheme-basic
            geometry
            lm
            enumitem

      - name: Poppler must be absent, so the Windows gate set is what runs
        run: |
          $found = @(Get-Command pdftotext, pdfinfo -All -ErrorAction SilentlyContinue)
          foreach ($c in $found) {
            Write-Host "$($c.Name) at $($c.Source)"
            & $c.Source -v 2>&1 | Select-Object -First 1 | ForEach-Object { Write-Host "  $_" }
          }
          if ($found) { throw "poppler tools are on PATH (listed above)" }

      - name: Extract the install and Quick start commands from README.md
        env:
          REPO: ${{ github.workspace }}/repo
        run: |
          python "$env:REPO/.github/scripts/readme_commands.py" "$env:REPO/README.md" windows `
            | Set-Content -Encoding utf8 "$env:RUNNER_TEMP/quickstart.ps1"
          Get-Content "$env:RUNNER_TEMP/quickstart.ps1"

      - name: Run them, timed
        working-directory: ${{ runner.temp }}
        env:
          REPO: ${{ github.workspace }}/repo
        run: |
          $start = Get-Date
          & "$env:RUNNER_TEMP/quickstart.ps1"
          # The script's `cd my-cv` carries over in PowerShell, so use absolute paths.
          $cv = Join-Path $env:RUNNER_TEMP "my-cv/out"
          if (-not (Test-Path "$cv/cv.pdf")) { throw "no $cv/cv.pdf" }
          if (-not (Test-Path "$cv/cv.report.json")) { throw "no $cv/cv.report.json" }
          $elapsed = [int]((Get-Date) - $start).TotalSeconds
          "Windows Quick start wall-clock: ${elapsed}s" | Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY
          if ($elapsed -ge 600) { throw "took ${elapsed}s, limit 600s" }
