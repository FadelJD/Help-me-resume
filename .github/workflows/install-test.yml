# Fresh-install test: a clean Ubuntu runner runs the README's Quick start commands, in order,
# and nothing else. The only substitution: the `pipx install ... git+...@main` line installs this
# commit instead, so the test checks the code being pushed. Must end with a PDF and a passing
# check, within 10 minutes of wall-clock time.
name: install-test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readme-quickstart:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo

      - name: Extract the Quick start commands from README.md
        env:
          REPO: ${{ github.workspace }}/repo
        run: |
          python3 - "$REPO/README.md" > "$RUNNER_TEMP/quickstart.sh" <<'PY'
          import re
          import sys

          text = open(sys.argv[1], encoding="utf-8").read()
          section = text.split("\n## Quick start\n", 1)[1].split("\n## ", 1)[0]
          lines = [ln for block in re.findall(r"```bash\n(.*?)```", section, re.S)
                   for ln in block.strip().splitlines()]
          installs = [ln for ln in lines if ln.startswith("pipx install ") and "cvforge" in ln]
          assert len(installs) == 1, f"expected one cvforge install line, got {installs}"
          for needed in ("cvforge init", "cvforge build", "cvforge check"):
              assert any(ln.startswith(needed) for ln in lines), f"Quick start lacks {needed}"
          print("set -euxo pipefail")
          for ln in lines:
              print('pipx install "$REPO[check]"' if ln in installs else ln)
          PY
          cat "$RUNNER_TEMP/quickstart.sh"

      - name: Run them, timed
        working-directory: ${{ runner.temp }}
        env:
          REPO: ${{ github.workspace }}/repo
        run: |
          start=$(date +%s)
          bash "$RUNNER_TEMP/quickstart.sh"
          test -s my-cv/out/cv.pdf
          test -s my-cv/out/cv.report.json
          elapsed=$(( $(date +%s) - start ))
          echo "Quick start wall-clock: ${elapsed}s" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$elapsed" -lt 600
