[project]
name = "cvforge"
version = "0.2.0"
description = "Turn a plain-text profile into a LaTeX CV on your own template, then prove it survives automated screening."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["ats", "latex", "cv", "resume", "cli"]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "ruamel.yaml>=0.18",
    "jinja2>=3.1",
    "rich>=13",
]

[project.optional-dependencies]
check = ["pdfplumber>=0.11", "pypdf>=4", "pdfminer.six>=20231228", "pypdfium2>=4"]
semantic = ["sentence-transformers>=3"]
llm = ["litellm>=1.40"]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
cvforge = "cvforge.cli:run"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cvforge"]

[tool.hatch.build.targets.wheel.force-include]
"templates" = "cvforge/templates"
"examples/profile.cv.txt" = "cvforge/examples/profile.cv.txt"
"examples/hats" = "cvforge/examples/hats"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".claude"]  # agent worktrees

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pdfplumber", "pdfplumber.*", "sentence_transformers", "litellm", "pdfminer.*", "pypdfium2"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "tex: needs a TeX engine (pdflatex) on PATH",
    "poppler: needs pdftotext (poppler) on PATH",
    "corpus: builds the public template corpus (see tests/fixtures/templates/provision.sh)",
]
